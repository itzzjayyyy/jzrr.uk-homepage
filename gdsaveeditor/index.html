<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD CC*.dat Pro Editor</title>
    <style>
        :root {
            --bg: #1a1a1b;
            --card: #272729;
            --accent: #00d2ff;
            --text: #e8eaed;
            --border: #3c4043;
            --btn-bg: #303134;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--card);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .main-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        button, .file-label {
            background: var(--btn-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            text-align: center;
        }

        button:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #editor-surface {
            margin-top: 20px;
            height: 500px;
            width: 100%;
            background: #000;
            color: #00ff41;
            font-family: 'Consolas', monospace;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid var(--border);
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0; font-size: 1.2rem;">GD Save Manager <span id="file-title" style="color:var(--accent); font-size: 0.8rem; margin-left: 10px;"></span></h2>
    <div class="loader" id="global-loader"></div>
</header>

<div class="container">
    <div class="main-controls">
        <label class="file-label">
            LOAD .DAT FILE
            <input type="file" id="load-dat" hidden>
        </label>
        
        <button id="save-win" disabled>SAVE (WINDOWS/ANDROID)</button>
        <button id="save-apple" disabled title="Slow AES Encryption">SAVE (MAC/IOS)</button>
        <button id="export-xml" disabled>EXPORT RAW XML</button>
    </div>

    <div class="card">
        <div id="status">Please load a CCGameManager.dat or CCLocalLevels.dat file.</div>
        <textarea id="editor-surface" spellcheck="false"></textarea>
    </div>
</div>

<script>
/**
 * GEOMETRY DASH INDEPENDENT CRYPTO LOGIC
 */
const XOR_KEY = 11;
const b64_chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

// UI Elements
const loadInp = document.getElementById('load-dat');
const editor = document.getElementById('editor-surface');
const status = document.getElementById('status');
const saveWinBtn = document.getElementById('save-win');
const saveAppleBtn = document.getElementById('save-apple');
const exportXmlBtn = document.getElementById('export-xml');
const loader = document.getElementById('global-loader');

loadInp.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    setLoading(true);
    status.innerText = "Decrypting...";
    
    try {
        const buffer = await file.arrayBuffer();
        const data = new Uint8Array(buffer);
        
        // 1. XOR
        for (let i = 0; i < data.length; i++) data[i] ^= XOR_KEY;
        
        // 2. Base64 URL to Standard
        let b64 = new TextDecoder().decode(data).replace(/_/g, '/').replace(/-/g, '+');
        
        // 3. Decompress
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        
        const ds = new DecompressionStream('gzip');
        const writer = ds.writable.getWriter();
        writer.write(bytes);
        writer.close();
        
        const output = await new Response(ds.readable).text();
        
        editor.value = output;
        editor.style.display = 'block';
        status.innerText = `Successfully Decrypted: ${file.name}`;
        enableButtons(true);
    } catch (err) {
        status.innerText = "Error: This file is either corrupted or already decrypted.";
        console.error(err);
    }
    setLoading(false);
});

// FEATURE: SAVE FOR WINDOWS (XOR -> Base64 -> Gzip)
saveWinBtn.addEventListener('click', async () => {
    setLoading(true);
    try {
        const xml = editor.value;
        const stream = new Blob([xml]).stream().pipeThrough(new CompressionStream('gzip'));
        const gzipBuffer = await new Response(stream).arrayBuffer();
        
        const b64 = btoa(String.fromCharCode(...new Uint8Array(gzipBuffer)))
            .replace(/\//g, '_').replace(/\+/g, '-');
            
        const finalData = new Uint8Array(b64.length);
        for(let i=0; i<b64.length; i++) {
            finalData[i] = b64.charCodeAt(i) ^ XOR_KEY;
        }
        
        download(finalData, 'CCGameManager.dat');
        status.innerText = "Saved for Windows/Android!";
    } catch(err) {
        alert("Save failed: " + err.message);
    }
    setLoading(false);
});

// FEATURE: EXPORT XML
exportXmlBtn.addEventListener('click', () => {
    const blob = new Blob([editor.value], {type: 'text/xml'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'decrypted_save.xml';
    a.click();
});

// Helper Functions
function setLoading(val) {
    loader.style.display = val ? 'block' : 'none';
}

function enableButtons(val) {
    saveWinBtn.disabled = !val;
    saveAppleBtn.disabled = !val; // Note: Original AES logic is browser-restricted but button is restored
    exportXmlBtn.disabled = !val;
}

function download(data, name) {
    const blob = new Blob([data], {type: 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
}
</script>
</body>
</html>
