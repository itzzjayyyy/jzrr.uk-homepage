<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD Save Editor Pro</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --accent: #00ca4e;
            --accent-hover: #00ff62;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --border: #333;
            --danger: #ff5f56;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Modern UI Components */
        header {
            width: 100%;
            padding: 2rem 0;
            background: var(--bg-card);
            text-align: center;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h1 { margin: 0; font-weight: 300; letter-spacing: 2px; color: var(--accent); }
        
        .container {
            width: 90%;
            max-width: 800px;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            background: rgba(255,255,255,0.02);
        }

        .drop-zone:hover {
            border-color: var(--accent);
            background: rgba(0, 202, 78, 0.05);
        }

        .btn {
            background: var(--accent);
            color: black;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn:active { transform: translateY(1px); }

        #output-area {
            margin-top: 20px;
            display: none;
        }

        pre {
            background: #000;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            border: 1px solid var(--border);
            font-family: 'Consolas', monospace;
            font-size: 13px;
        }

        .status-msg { margin-top: 15px; color: var(--text-dim); font-size: 0.9rem; }

        /* Loader Animation */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <h1>GD DAT EDITOR</h1>
    <p style="color: var(--text-dim)">CCGameManager.dat & CCLocalLevels.dat</p>
</header>

<div class="container">
    <div class="drop-zone" id="dropZone">
        <p id="dropText">Drag & Drop save files here or click to upload</p>
        <input type="file" id="fileInput" hidden>
        <button class="btn">Select File</button>
    </div>

    <div id="output-area">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 id="fileNameDisplay">File: None</h3>
            <button class="btn" onclick="downloadModified()">Download Decrypted XML</button>
        </div>
        <div class="status-msg"><span id="loader" class="loader"></span> <span id="statusText">Ready</span></div>
        <pre id="xmlContent">XML will appear here...</pre>
    </div>
</div>

<script>
/**
 * CORE LOGIC - Independent GD Decryption
 * No external libraries required.
 */

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const xmlContent = document.getElementById('xmlContent');
const outputArea = document.getElementById('output-area');
const statusText = document.getElementById('statusText');
const loader = document.getElementById('loader');

// Handle File Selection
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = 'var(--border)'; });
dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    handleFile(e.dataTransfer.files[0]);
});

async function handleFile(file) {
    if (!file) return;
    
    loader.style.display = 'inline-block';
    statusText.innerText = "Processing...";
    outputArea.style.display = 'block';
    document.getElementById('fileNameDisplay').innerText = `File: ${file.name}`;

    const reader = new FileReader();
    reader.onload = async (e) => {
        try {
            const data = new Uint8Array(e.target.result);
            const decrypted = await decryptGD(data);
            xmlContent.innerText = decrypted;
            statusText.innerText = "Decryption Successful!";
        } catch (err) {
            statusText.innerText = "Error: " + err.message;
        } finally {
            loader.style.display = 'none';
        }
    };
    reader.readAsArrayBuffer(file);
}

/**
 * GD Decryption Logic (XOR 11 -> Base64 -> Gzip Decompress)
 */
async function decryptGD(data) {
    // 1. XOR with key 11
    for (let i = 0; i < data.length; i++) {
        data[i] ^= 11;
    }

    // 2. Convert to String (Handling potential Base64 URL safe variations)
    let b64 = new TextDecoder().decode(data)
        .replace(/_/g, '/')
        .replace(/-/g, '+');

    // 3. Decode Base64
    const binaryStr = atob(b64);
    const bytes = new Uint8Array(binaryStr.length);
    for (let i = 0; i < binaryStr.length; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
    }

    // 4. Decompress Gzip (Using Native DecompressionStream)
    const ds = new DecompressionStream('gzip');
    const writer = ds.writable.getWriter();
    writer.write(bytes);
    writer.close();

    const response = new Response(ds.readable);
    const decompressed = await response.text();
    
    return decompressed;
}

function downloadModified() {
    const blob = new Blob([xmlContent.innerText], { type: 'application/xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'decrypted_save.xml';
    a.click();
    URL.revokeObjectURL(url);
}
</script>
</body>
</html>
